# TMail production sandbox. Install as:
# /etc/systemd/system/tmail-app.service.d/95-security-hardening.conf
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectHostname=yes
ProtectClock=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
NoExecPaths=/tmp /var/tmp /dev/shm
InaccessiblePaths=/var/spool/cron /var/spool/cron/crontabs
ReadWritePaths=/var/www/TMail/tmail-app/.next/cache
UMask=0077
